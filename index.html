<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#14325a"><title>Hike Table Mountain</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#0b1b33;--mut:#586579;--ac:#f47f14;--ac2:#14325a;--bd:#d8dee8;--sky:#dce6f3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1626;--card:#12233a;--tx:#eaf0f8;--mut:#93a3b8;--ac:#ff8a1f;--ac2:#7fb0e6;--bd:#223652;--sky:#16304f}}
:root[data-theme="dark"]{--bg:#0b1626;--card:#12233a;--tx:#eaf0f8;--mut:#93a3b8;--ac:#ff8a1f;--ac2:#7fb0e6;--bd:#223652;--sky:#16304f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif}
body{max-width:520px;margin:0 auto;min-height:100vh}
h1{font-size:28px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.05}
.top{padding:18px 18px 8px;text-align:center}.logo{display:block;width:min(260px,70%);margin:0 auto;background:#fff;border-radius:18px}
.top p{margin:6px 0 0;color:var(--mut);font-size:14px}
.trail{display:block;width:calc(100% - 24px);margin:0 12px 10px;padding:14px 16px;background:var(--card);border:1px solid var(--bd);border-radius:14px;text-align:left;color:inherit;font:inherit;cursor:pointer}
.trail:focus-visible,button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.trail b{font-size:17px;font-weight:600}
.row{display:flex;gap:16px;margin-top:8px;font-size:13px;color:var(--mut);flex-wrap:wrap}
.row span strong{color:var(--tx);font-weight:600}
.tag{float:right;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--sky);color:var(--ac2)}
.tag.Hard{background:var(--ac);color:#0b1b33}
.note{margin:14px 18px 24px;font-size:12px;color:var(--mut);line-height:1.5}
#trail{display:none}
#map{position:relative;height:44vh;min-height:260px;background:linear-gradient(var(--sky),var(--bg));touch-action:none}
#map canvas{display:block;width:100%;height:100%}
.back{position:absolute;top:12px;left:12px;z-index:2;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.hint{position:absolute;bottom:8px;right:12px;font-size:11px;color:var(--mut)}
.panel{padding:16px 18px 28px}
.panel h2{margin:0 0 4px;font-size:22px;font-weight:800}
.panel p{margin:0 0 12px;font-size:14px;color:var(--mut);line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.stat small{display:block;font-size:12px;color:var(--mut)}
.stat b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
svg.chart{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px}
.btns{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;font-size:15px;cursor:pointer}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#0b1b33}
.msg{font-size:12px;color:var(--mut);margin-top:10px;min-height:16px}
</style></head><body>

function H(x,z){const d=Math.hypot(x/.85,z/.5),s=ss(1.4,.6,d);
 const n=Math.sin(x*9)*Math.cos(z*7)*.03+Math.sin(x*23+z*17)*.012;
 let h=1086*s*(1+n*(s<.97?1:.12));
 h+=420*Math.exp(-((x-1)**2+(z+.05)**2)/.05)+300*Math.exp(-((x+1.15)**2+(z-.05)**2)/.04);
 return Math.max(0,h)}
const contour=[];for(let x=-.7;x<=.7;x+=.1)contour.push([x,.5*Math.sqrt(1.12*1.12-(x/.85)**2)]);
const TR=[
{n:'Platteklip Gorge',km:3,h:2.5,d:'Moderate',t:'The classic direct route up the front face. Steep steps, little shade.',p:[[-.05,.68],[-.03,.55],[-.06,.42],[-.04,.3],[0,.15]]},
{n:'India Venster',km:3.2,h:3,d:'Hard',t:'Exposed scrambling with chains in places. Not for a first hike.',p:[[-.55,.62],[-.45,.5],[-.38,.4],[-.3,.3],[-.2,.15]]},
{n:'Skeleton Gorge',km:4.5,h:3.5,d:'Moderate',t:'Starts in Kirstenbosch. Forest, ladders and a long rocky climb.',p:[[.75,.55],[.68,.45],[.6,.38],[.5,.3],[.3,.12],[.45,0]]},
{n:'Pipe Track',km:6,h:2,d:'Easy',t:'A gentle contour path under the Twelve Apostles with big ocean views.',p:contour}];
const N=120;
TR.forEach(t=>{t.s=[];for(let i=0;i<N;i++){const f=i/(N-1)*(t.p.length-1),k=Math.min(t.p.length-2,Math.floor(f)),u=f-k,a=t.p[k],b=t.p[k+1];
 const x=a[0]+(b[0]-a[0])*u,z=a[1]+(b[1]-a[1])*u;t.s.push({x,z,e:H(x,z)})}
 t.min=Math.min(...t.s.map(q=>q.e));t.max=Math.max(...t.s.map(q=>q.e));
 t.asc=0;for(let i=1;i<N;i++)t.asc+=Math.max(0,t.s[i].e-t.s[i-1].e)});
const $=id=>document.getElementById(id),r0=v=>Math.round(v);
$('cards').innerHTML=TR.map((t,i)=>`<button class="trail" data-i="${i}"><span class="tag ${t.d}">${t.d}</span><b>${t.n}</b>
<div class="row"><span><strong>${t.km} km</strong> distance</span><span><strong>${r0(t.asc)} m</strong> ascent</span><span><strong>${t.h} h</strong> one way</span></div></button>`).join('');
$('cards').onclick=e=>{const b=e.target.closest('.trail');if(b)open(+b.dataset.i)};
// ---- 3D
const W=10,Y=e=>e/1086*2.4;let sc,cam,ren,grp,mark,cur,th=.35,ph=1,rad=17,running=false;
function init(){const m=$('map');ren=new THREE.WebGLRenderer({antialias:true,alpha:true});ren.setPixelRatio(Math.min(2,devicePixelRatio));
 m.insertBefore(ren.domElement,m.firstChild);sc=new THREE.Scene();cam=new THREE.PerspectiveCamera(45,1,.1,100);
 sc.add(new THREE.HemisphereLight(0xffffff,0x445566,.75));const dl=new THREE.DirectionalLight(0xfff2dd,.9);dl.position.set(-6,10,8);sc.add(dl);
 const g=new THREE.PlaneGeometry(2.8*W,2*W,100,70);g.rotateX(-Math.PI/2);const p=g.attributes.position,col=[];
 for(let i=0;i<p.count;i++){const e=H(p.getX(i)/W,p.getZ(i)/W);p.setY(i,Y(e));const k=e/1086;
  const c=new THREE.Color().setHSL(k<.12?.3:k<.6?.1:.08,k<.12?.4:.25,k<.12?.32:.38+k*.22);col.push(c.r,c.g,c.b)}
 g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.computeVertexNormals();
 sc.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true})));
 grp=new THREE.Group();sc.add(grp);mark=new THREE.Mesh(new THREE.SphereGeometry(.2,16,12),new THREE.MeshBasicMaterial({color:0x2a9dff}));sc.add(mark);
 let dx=null;const c=ren.domElement;
 c.onpointerdown=e=>{dx=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};c.onpointerup=()=>dx=null;
 c.onpointermove=e=>{if(!dx)return;th-=(e.clientX-dx[0])*.008;ph=Math.min(1.45,Math.max(.25,ph-(e.clientY-dx[1])*.006));dx=[e.clientX,e.clientY]};
 c.onwheel=e=>{e.preventDefault();rad=Math.min(26,Math.max(7,rad+e.deltaY*.01))};
 addEventListener('resize',size)}
function size(){const m=$('map');ren.setSize(m.clientWidth,m.clientHeight);cam.aspect=m.clientWidth/m.clientHeight;cam.updateProjectionMatrix()}
function loop(){if(!running)return;cam.position.set(rad*Math.sin(ph)*Math.sin(th),1+rad*Math.cos(ph),rad*Math.sin(ph)*Math.cos(th));cam.lookAt(0,1,0);ren.render(sc,cam);requestAnimationFrame(loop)}
const P=(q)=>new THREE.Vector3(q.x*W,Y(q.e)+.12,q.z*W);
function setTrail(t){while(grp.children.length)grp.remove(grp.children[0]);
 const cv=new THREE.CatmullRomCurve3(t.s.map(P));grp.add(new THREE.Mesh(new THREE.TubeGeometry(cv,200,.07,6),new THREE.MeshBasicMaterial({color:0xf47f14})));
 const s=new THREE.Mesh(new THREE.SphereGeometry(.16,12,10),new THREE.MeshBasicMaterial({color:0xffffff}));s.position.copy(P(t.s[0]));grp.add(s);mark.position.copy(P(t.s[0]))}
// ---- trail screen
let T,tm=null,ws=null,S;
function chart(t){const w=300,h=90,r=t.max-t.min||1;const pt=(i)=>[i/(N-1)*w,h-8-(t.s[i].e-t.min)/r*(h-24)];
 let d='M0,'+h;for(let i=0;i<N;i++)d+=' L'+pt(i).join(',');d+=` L${w},${h}Z`;
 return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Elevation profile"><path d="${d}" fill="var(--ac2)" opacity=".28"/><path d="${d.replace(/^M0,\d+ /,'M').replace(/ L\d+,\d+Z$/,'')}" fill="none" stroke="var(--ac2)" stroke-width="2"/><circle id="dot" cx="0" cy="${pt(0)[1]}" r="5" fill="#2a9dff" stroke="#fff" stroke-width="2"/><text x="6" y="12" font-size="10" fill="var(--mut)">${r0(t.max)} m</text><text x="6" y="${h-1}" font-size="10" fill="var(--mut)">${r0(t.min)} m</text></svg>`}
function open(i){T=TR[i];$('list').style.display='none';$('trail').style.display='block';scrollTo(0,0);
 if(!ren){init()}size();setTrail(T);rad=17;th=.35;ph=1;running=true;loop();info()}
function info(){stop();$('panel').innerHTML=`<h2>${T.n}</h2><p>${T.t}</p>
<div class="grid"><div class="stat"><small>Distance</small><b>${T.km} km</b></div><div class="stat"><small>Ascent</small><b>${r0(T.asc)} m</b></div><div class="stat"><small>Top</small><b>${r0(T.max)} m</b></div></div>
${chart(T)}<div class="btns"><button class="btn pri" id="sim">Start hike</button><button class="btn" id="gps">Use my GPS</button></div>
<div class="msg">“Start hike” simulates a walk along the route. “Use my GPS” records your real position.</div>`;
 $('sim').onclick=()=>begin('sim');$('gps').onclick=()=>begin('gps')}
function begin(mode){S={dist:0,asc:0,alt:T.s[0].e,prog:0,last:null,t0:Date.now(),mode};
 $('panel').innerHTML=`<h2>${T.n}</h2><div class="grid" style="grid-template-columns:repeat(2,1fr)">
<div class="stat"><small>Time</small><b id="v-t">0:00:00</b></div><div class="stat"><small>Distance</small><b id="v-d">0.00 km</b></div>
<div class="stat"><small>Altitude</small><b id="v-a">0 m</b></div><div class="stat"><small>Ascent so far</small><b id="v-s">0 m</b></div></div>
${chart(T)}<div class="btns"><button class="btn pri" id="stop">Finish hike</button></div><div class="msg" id="msg"></div>`;
 $('stop').onclick=()=>{const m=S;stop();info();$('panel').querySelector('.msg').textContent=`Saved: ${(m.dist).toFixed(2)} km, ${r0(m.asc)} m climbed.`};
 if(mode==='sim'){tm=setInterval(()=>{S.prog=Math.min(1,S.prog+.004);const f=S.prog*(N-1),k=Math.min(N-2,Math.floor(f)),u=f-k,e=T.s[k].e+(T.s[k+1].e-T.s[k].e)*u;
  S.asc+=Math.max(0,e-S.alt);S.alt=e;S.dist=T.km*S.prog;S.sec=S.prog*T.h*3600;
  const a=T.s[k],b=T.s[k+1];mark.position.copy(P({x:a.x+(b.x-a.x)*u,z:a.z+(b.z-a.z)*u,e}));draw(S.prog);if(S.prog>=1){clearInterval(tm);$('msg').textContent='You reached the top!'}},200)}
 else{if(!navigator.geolocation){$('msg').textContent='GPS is not available on this device.';return}
  $('msg').textContent='Waiting for GPS signal…';
  try{ws=navigator.geolocation.watchPosition(p=>{const c=p.coords;if(c.accuracy>50)return;$('msg').textContent='GPS locked ('+r0(c.accuracy)+' m accuracy)';
   if(S.last){const R=6371,r=Math.PI/180,dl=(c.latitude-S.last.latitude)*r,dn=(c.longitude-S.last.longitude)*r;
    const a=Math.sin(dl/2)**2+Math.cos(c.latitude*r)*Math.cos(S.last.latitude*r)*Math.sin(dn/2)**2;S.dist+=2*R*Math.asin(Math.sqrt(a))}
   if(c.altitude!=null){if(S.last&&S.last.altitude!=null&&c.altitude-S.last.altitude>1)S.asc+=c.altitude-S.last.altitude;S.alt=c.altitude}
   S.last=c;S.sec=(Date.now()-S.t0)/1000;draw()},er=>{$('msg').textContent='Location blocked. Allow location access to track your hike.'},{enableHighAccuracy:true})}
  catch(e){$('msg').textContent='Could not start GPS.'}}}
function draw(prog){const f=x=>{const s=Math.floor(x);return Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
 const g=id=>$(id);if(!g('v-t'))return;g('v-t').textContent=f(S.sec||0);g('v-d').textContent=S.dist.toFixed(2)+' km';g('v-a').textContent=r0(S.alt)+' m';g('v-s').textContent=r0(S.asc)+' m';
 if(prog!=null&&g('dot')){const i=Math.round(prog*(N-1)),r=T.max-T.min||1;g('dot').setAttribute('cx',i/(N-1)*300);g('dot').setAttribute('cy',90-8-(T.s[i].e-T.min)/r*66)}}
function stop(){clearInterval(tm);if(ws!=null){navigator.geolocation.clearWatch(ws);ws=null}}
$('back').onclick=()=>{stop();running=false;$('trail').style.display='none';$('list').style.display='block'};
</script></body></html>
